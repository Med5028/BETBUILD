name: Daten aktualisieren

"on":
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install numpy pandas scipy

      - name: Ligen berechnen
        run: python modell.py --export --saisons 2223 2324 2425 2526 2627

      - name: Seite fertigstellen
        run: |
          python - <<'PY'
          import re, json, sys
          h = open("wettrechner_alle.html", encoding="utf-8").read()
          if "manifest.json" not in h:
              h = h.replace("</head>",
                  '<link rel="manifest" href="manifest.json">\n'
                  '<link rel="apple-touch-icon" href="icon-192.png">\n</head>', 1)
          if "serviceWorker" not in h:
              h = h.replace("</body>",
                  '<script>\n'
                  'if ("serviceWorker" in navigator) {\n'
                  '  window.addEventListener("load", function(){\n'
                  '    navigator.serviceWorker.register("sw.js").catch(function(){});\n'
                  '  });\n'
                  '}\n</script>\n</body>', 1)
          m = re.search(r"var LIGEN = (\{.*?\});\s*\n\s*var MODELL", h, re.S)
          if not m:
              sys.exit("Ligablock nicht gefunden")
          d = json.loads(m.group(1))
          teams = sum(len(v["teams"]) for v in d.values())
          print(f"{len(d)} Ligen, {teams} Teams")
          if len(d) < 5 or teams < 100:
              sys.exit("Zu wenig Inhalt")
          open("index.html", "w", encoding="utf-8").write(h)
          PY

      - name: Speichern
        run: |
          git config user.name "Wettrechner Bot"
          git config user.email "actions@github.com"
          rm -rf daten wettrechner_alle.html
          git add index.html
          git diff --staged --quiet || (git commit -m "Daten aktualisiert" && git push)
